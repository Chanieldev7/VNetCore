name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx --yes html-validate@9 index.html landing.html
      - run: npx --yes prettier@3 --check index.html styles.css app.js core.js boot.js date-picker.js landing.html landing.css landing.js demo-project.js tests package.json
